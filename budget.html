
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Budget Tracker | Budget Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>💰 Student Budget Tracker</h1>
    <p>Monthly Budget Calculator</p>
</header>

<div class="container">

    <h2>Enter Your Monthly Budget</h2>

    <label for="income">Monthly Income (R)</label>
    <input
        type="number"
        id="income"
        placeholder="Enter income"
        min="0.01"
        step="0.01"
        required
    >

    <label for="food">Food (R)</label>
    <input
        type="number"
        id="food"
        placeholder="Food expense"
        min="0"
        step="0.01"
        value="0"
        required
    >

    <label for="transport">Transport (R)</label>
    <input
        type="number"
        id="transport"
        placeholder="Transport expense"
        min="0"
        step="0.01"
        value="0"
        required
    >

    <label for="accommodation">Accommodation (R)</label>
    <input
        type="number"
        id="accommodation"
        placeholder="Accommodation expense"
        min="0"
        step="0.01"
        value="0"
        required
    >

    <label for="books">Books (R)</label>
    <input
        type="number"
        id="books"
        placeholder="Books expense"
        min="0"
        step="0.01"
        value="0"
        required
    >

    <label for="entertainment">Entertainment (R)</label>
    <input
        type="number"
        id="entertainment"
        placeholder="Entertainment expense"
        min="0"
        step="0.01"
        value="0"
        required
    >

    <button type="button" onclick="calculateBudget()">
        Calculate Budget
    </button>

    <div class="menu-card">

        <h3>Budget Summary</h3>

        <p>
            <strong>Total Expenses:</strong>
            <span id="totalExpenses">R0.00</span>
        </p>

        <p>
            <strong>Remaining Balance:</strong>
            <span id="remainingBalance">R0.00</span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="budgetStatus">-</span>
        </p>

    </div>

    <div class="menu-card chart-card">

        <h3>Budget Graph</h3>

        <div class="chart-container">
            <canvas id="budgetChart"></canvas>
        </div>

    </div>

    <button
        type="button"
        onclick="window.location.href='dashboard.html'"
    >
        Back to Dashboard
    </button>

</div>

<!-- Chart.js must load before script.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
